<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="You are invited to droo's 20th birthday."
    >

    <title>droo's 20th Birthday</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="home-page">

    <header class="site-header">
        <div class="container">
            <h1 class="site-title">
                droo's 20th Birthday
            </h1>
        </div>
    </header>

    <main id="main-content">
        <section
            class="hero"
            aria-label="Birthday invitation"
        >
            <div class="container hero__layout">
                <div class="hero__content">
                    <p class="eyebrow">
                        You are invited!
                    </p>

                    <div class="hero__actions">
                        <a
                            class="button button--primary"
                            href="details.html"
                        >
                            Details
                        </a>

                        <a
                            class="button button--primary"
                            href="details.html#rsvp"
                        >
                            RSVP Now
                        </a>

                        <a
                            class="button button--primary"
                            href="wishlist.html"
                        >
                            Wishlist
                        </a>

                        <a
                            class="button button--primary"
                            href="account.html"
                        >
                            Account
                        </a>
                    </div>

                    <p class="hero__date">
                        <time datetime="2026-08-30">
                            August 30
                        </time>
                        to
                        <time datetime="2026-08-31">
                            August 31, 2026
                        </time>
                    </p>
                </div>

                <div
                    class="hero__gallery"
                    aria-label="Birthday-themed images"
                >
                    <img
                        class="hero-image hero-image--primary"
                        src="im-twenty.jpg"
                        alt="Black-and-white manga illustration with a speech bubble saying I'm twenty"
                    >

                    <img
                        class="hero-image hero-image--secondary"
                        src="bocchi-glasses.jpg"
                        alt="Pink-haired animated character wearing star-shaped glasses and a party hat"
                    >
                </div>
            </div>
        </section>
    </main>
</body>
</html>
